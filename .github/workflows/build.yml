
name: Build APK
on: [push, pull_request]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
        
    - name: Set up Python
      uses: actions/setup-python@v5
      with: python-version: 3.11
      
    - name: Install Buildozer
      run: pip install buildozer==1.5.0 cython==0.29.36
      
    - name: Install Dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libffi-dev libssl-dev libsdl2-dev libsox-fmt-all
        
    - name: Accept Licenses
      run: yes | sdkmanager --licenses
      
    - name: Build APK
      run: |
        buildozer android clean
        buildozer android debug
        
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: WildlifePro-APK
        path: bin/*.apk
