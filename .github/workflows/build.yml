
name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build APK with Buildozer (Docker)
        run: |
          docker run --rm \
            -v "$GITHUB_WORKSPACE:/home/user/hostcwd" \
            -w /home/user/hostcwd \
            kivy/buildozer:2023.10.09 \
            android debug --accept-sdk-license

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WildlifeProStudio-APK
          path: bin/*.apk
