name: Build Android APK (Buildozer Native – FIXED)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            python3 python3-pip python3-venv \
            git zip unzip \
            openjdk-17-jdk \
            wget

      - name: Install Buildozer
        run: |
          pip3 install --upgrade pip
          pip3 install cython==0.29.36 buildozer

      # 🔥 FORCE INSTALL ANDROID SDK + BUILD-TOOLS 33.0.2
      - name: Install Android SDK + build-tools 33.0.2
        run: |
          mkdir -p $HOME/android-sdk
          cd $HOME/android-sdk

          wget https://dl.google.com/android/repository/commandlinetools-linux-9477386_latest.zip
          unzip commandlinetools-linux-9477386_latest.zip
          mkdir -p cmdline-tools/latest
          mv cmdline-tools/* cmdline-tools/latest/ || true

          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH

          yes | sdkmanager --licenses
          sdkmanager "platform-tools" "platforms;android-33" "build-tools;33.0.2"

      # 🔥 WIPE ANY BROKEN BUILD0ZER SDK
      - name: Clean Buildozer Android dir
        run: |
          rm -rf ~/.buildozer/android

      - name: Build APK
        env:
          ANDROID_SDK_ROOT: ${{ env.HOME }}/android-sdk
        run: |
          buildozer android debug
