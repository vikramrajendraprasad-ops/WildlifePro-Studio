
name: Build
on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # STEP 1: Fix Permissions (Crucial for Docker)
      - name: Fix Permissions
        run: |
          sudo chmod -R 777 .
          
      # STEP 2: Verify Files Exist (Debug Step)
      - name: Verify Files
        run: |
          ls -la
          ls -lh libffmpeg.so || echo "WARNING: libffmpeg.so is MISSING"

      # STEP 3: Build with Verbose Logging
      - name: Build
        uses: ArtemSBulgakov/buildozer-action@v1
        id: buildozer
        with:
          command: buildozer -v android debug
          buildozer_version: stable

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: ${{ steps.buildozer.outputs.filename }}
