
name: Build (Docker Manual)
on: [push]

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Prepare Workspace
        run: |
          # Fix permissions for Docker
          sudo chmod -R 777 .
          # Create bin directory
          mkdir bin
          # Verify .so file
          ls -lh libffmpeg.so

      - name: Build APK with Docker
        # We run the official buildozer container directly
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/home/user/hostcwd \
            -v ${{ github.workspace }}/bin:/home/user/hostcwd/bin \
            -w /home/user/hostcwd \
            kivy/buildozer \
            buildozer android debug

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: package
          path: bin/*.apk
