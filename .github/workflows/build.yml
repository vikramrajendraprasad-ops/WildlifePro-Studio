name: Build APK

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - uses: actions/checkout@v4
    
    # Java 17 for Android
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'
    
    # Python 3.11
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    
    # Install Buildozer + Cython (PyDub compatible)
    - name: Install Buildozer
      run: pip install --upgrade buildozer cython==0.29.33
    
    # Ubuntu dependencies (includes PyDub libs)
    - name: Install Linux Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config \
          zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev \
          libsdl2-dev libsdl2-image-dev libsdl2-mixer-dev libsdl2-ttf-dev \
          libportmidi-dev libswscale-dev libavformat-dev libavcodec-dev libmp3lame-dev libopus-dev
    
    # Build APK
    - name: Build APK
      run: |
        buildozer android debug
    
    # Upload APK
    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: WildlifePro-APK
        path: bin/*.apk
        retention-days: 30
