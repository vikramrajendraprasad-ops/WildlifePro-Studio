name: Build Android APK (Buildozer Native)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt update
          sudo apt install -y \
            python3 python3-pip python3-setuptools python3-venv \
            git zip unzip openjdk-17-jdk \
            autoconf automake libtool pkg-config \
            zlib1g-dev libncurses5-dev libncursesw5-dev \
            libtinfo5 cmake

      - name: Install Buildozer
        run: |
          python3 -m pip install --upgrade pip
          pip3 install cython==0.29.36 buildozer

      # 🔑 THIS IS THE FIX
      - name: Clean old Buildozer Android SDK
        run: |
          rm -rf ~/.buildozer/android

      - name: Build APK
        run: |
          buildozer android debug --accept-sdk-license

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: WildlifeProStudio-APK
          path: bin/*.apk
